<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000000; font-family: Arial, sans-serif; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Dependencies are vendored under ./vendor so the app runs with no
       internet (projection venues can't rely on wifi). To fall back to the
       CDN, swap the importmap below for this one:
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/+esm"
      }
    }
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "mp4-muxer": "./vendor/mp4-muxer/mp4-muxer.mjs"
      }
    }
  </script>
  <script type="module" src="./src/main.js?v=20"></script>
</body>
</html>
