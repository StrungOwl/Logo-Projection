<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Projection</title>
  <!-- Inline favicon: kills the /favicon.ico 404 (matters for headless
       captures + TouchDesigner Web Render TOP consoles). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='78' font-size='80' font-family='Georgia' font-weight='bold' fill='%23FFBF00' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000000; font-family: Arial, sans-serif; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Dependencies are vendored under ./vendor so the app runs with no
       internet (projection venues can't rely on wifi). To fall back to the
       CDN, swap the importmap below for this one:
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/+esm"
      }
    }
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "mp4-muxer": "./vendor/mp4-muxer/mp4-muxer.mjs"
      }
    }
  </script>
  <script type="module" src="./src/main.js?v=20"></script>
</body>
</html>
