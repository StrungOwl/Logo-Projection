<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000000; font-family: Arial, sans-serif; }
    canvas { display: block; }

    #panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 280px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(20, 20, 40, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 16px;
      color: #ddd;
      font-size: 13px;
      z-index: 100;
    }
    #panel h2 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 8px;
      cursor: pointer;
    }
    .light-section {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .light-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .light-header span { font-weight: bold; font-size: 13px; }
    .light-header button {
      background: rgba(255, 60, 60, 0.7);
      border: none;
      color: #fff;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 11px;
    }
    .light-header button:hover { background: rgba(255, 60, 60, 1); }
    .control-row {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
    }
    .control-row label {
      width: 70px;
      font-size: 12px;
      color: #aaa;
      flex-shrink: 0;
    }
    .control-row input[type="range"] {
      flex: 1;
      height: 4px;
      accent-color: #FFBF00;
    }
    .control-row input[type="color"] {
      width: 32px;
      height: 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }
    .control-row .value {
      width: 36px;
      text-align: right;
      font-size: 11px;
      color: #888;
    }
    #addLightBtn {
      width: 100%;
      padding: 8px;
      background: rgba(255, 191, 0, 0.2);
      border: 1px solid rgba(255, 191, 0, 0.4);
      color: #FFBF00;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 4px;
    }
    #addLightBtn:hover { background: rgba(255, 191, 0, 0.35); }
    #togglePanel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 101;
      background: rgba(20, 20, 40, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: #FFBF00;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createIslamicPanel } from './patterns/islamic-tile.js';
    import { createLatticeUnderlay } from './patterns/lattice-underlay.js';
    import { createGateFrame } from './patterns/gate-frame.js';

    // Scene
    const scene = new THREE.Scene();
    window.__scene = scene;
    window.__THREE = THREE;
    scene.background = new THREE.Color(0x000000);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 3);
    window.__camera = camera;

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    document.body.appendChild(renderer.domElement);

    // Environment map for metallic reflections
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x888888);
    const envMap = pmremGenerator.fromScene(envScene).texture;
    scene.environment = envMap;

    // Lights — cinematic rim lighting for stronger dimension
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(5, 8, 4);  // steeper top-front-right
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x4d8aff, 1.5);  // cool blue, from behind
    rimLight.position.set(-3, 2, -6);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
    fillLight.position.set(0, -4, 2);
    scene.add(fillLight);

    // Vibrant orange back glow — spills onto dome from inside the model
    const innerGlow = new THREE.PointLight(0xff6a18, 80, 40, 1.6);
    innerGlow.position.set(0, -1.0, -2.0);
    scene.add(innerGlow);

    // Subtle rim accents on the pattern layers. Warm ember kissing the front
    // pattern edges, cooler dim behind the rear pattern — tight falloff so
    // they graze the reliefs without lifting the ambient brightness.
    const frontPatternLight = new THREE.PointLight(0xffb070, 1.8, 5, 2);
    frontPatternLight.position.set(-2.8, 1.8, 2.6);
    scene.add(frontPatternLight);

    const rearPatternLight = new THREE.PointLight(0x7a96c8, 1.2, 6, 2);
    rearPatternLight.position.set(2.8, 1.2, -1.2);
    scene.add(rearPatternLight);

    // Helper: inject a simple world-Y gradient tint into any MeshStandardMaterial
    // via onBeforeCompile. Darkens/warms toward the bottom, brightens neutral at
    // the top — subtle depth cue without overriding the existing lighting model.
    function applyGradientTint(mat, {
      minY = -5,
      maxY = 5,
      darkTint = [0.72, 0.6, 0.44],
      brightTint = [1.02, 1.0, 0.95],
    } = {}) {
      const uniforms = {
        uGradMinY:   { value: minY },
        uGradMaxY:   { value: maxY },
        uGradDark:   { value: new THREE.Vector3(...darkTint) },
        uGradBright: { value: new THREE.Vector3(...brightTint) },
      };
      mat.onBeforeCompile = (shader) => {
        Object.assign(shader.uniforms, uniforms);
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>',
            '#include <common>\nvarying vec3 vGradWP;')
          .replace('#include <project_vertex>',
            '#include <project_vertex>\nvGradWP = (modelMatrix * vec4(position, 1.0)).xyz;');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>',
            `#include <common>
             uniform float uGradMinY;
             uniform float uGradMaxY;
             uniform vec3  uGradDark;
             uniform vec3  uGradBright;
             varying vec3  vGradWP;`)
          .replace('#include <color_fragment>',
            `#include <color_fragment>
             float _gt = clamp((vGradWP.y - uGradMinY) / max(uGradMaxY - uGradMinY, 1e-4), 0.0, 1.0);
             diffuseColor.rgb *= mix(uGradDark, uGradBright, _gt);`);
      };
      mat.userData.gradUniforms = uniforms;
    }

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);
    window.__controls = controls;

    // Particle material (created once, updated in animate loop)
    let particleMat = null;
    let galaxyMat = null;

    // Galaxy / deep-space shader — stars + nebula, masked automatically by the logo mesh shape
    function createGalaxyMaterial() {
      return new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uCenter: { value: new THREE.Vector2(0, 0) },
          uRadius: { value: 1.0 },
        },
        vertexShader: `
          varying vec3 vLocalPos;
          varying vec3 vNormal;
          void main() {
            vLocalPos = position;
            vNormal = normal;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec2 uCenter;
          uniform float uRadius;
          varying vec3 vLocalPos;
          varying vec3 vNormal;

          float hash21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

          float vnoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
                       mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x), u.y);
          }

          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 6; i++) {
              v += a * vnoise(p);
              p = p * 2.03 + vec2(17.0, 31.0);
              a *= 0.5;
            }
            return v;
          }

          float starLayer(vec2 p, float scale, float threshold, float sharpness) {
            p *= scale;
            vec2 cell = floor(p);
            vec2 f = fract(p) - 0.5;
            float n = hash21(cell);
            if (n < threshold) return 0.0;
            vec2 jitter = vec2(hash21(cell + 13.17), hash21(cell + 47.31)) - 0.5;
            float d = length(f - jitter * 0.6);
            float intensity = (n - threshold) / (1.0 - threshold);
            float twinkle = 0.55 + 0.45 * sin(uTime * (1.5 + n * 7.0) + n * 100.0);
            return smoothstep(0.5, 0.0, d * sharpness) * intensity * twinkle;
          }

          void main() {
            vec2 p = vLocalPos.xy * 0.08;

            // Domain-warped FBM — q and r feed p back into itself on a slow
            // time offset so the clouds churn and morph in place instead of
            // just scrolling past.
            float tw = uTime * 0.05;
            vec2 q = vec2(
              fbm(p + vec2(tw * 0.6, -tw * 0.4)),
              fbm(p + vec2(5.2, 1.3) - vec2(tw * 0.3, tw * 0.5))
            );
            vec2 r = vec2(
              fbm(p + 3.0 * q + vec2(1.7, 9.2) + vec2(tw * 0.8, 0.0)),
              fbm(p + 3.0 * q + vec2(8.3, 2.8) - vec2(0.0, tw * 0.7))
            );
            float n1 = fbm(p * 0.6 + 2.2 * r);
            float n2 = fbm(p * 1.3 + 1.8 * r + vec2(5.0, -3.0));
            float nebulaDensity = pow(clamp(n1 * n2 * 2.4, 0.0, 1.3), 2.4);
            // Threshold so most of the field falls to pure black void,
            // leaving only brighter tendrils. Lots of empty sky for stars.
            nebulaDensity = smoothstep(0.18, 0.85, nebulaDensity);

            // Desaturated amber/rust palette — warm dust, not technicolor nebula.
            vec3 deepSpace = vec3(0.012, 0.009, 0.018);
            vec3 nebDark   = vec3(0.10, 0.06, 0.04);
            vec3 nebAmber  = vec3(0.60, 0.38, 0.14);
            vec3 nebRust   = vec3(0.40, 0.18, 0.09);
            vec3 nebula = mix(nebDark, nebAmber, n1);
            nebula = mix(nebula, nebRust, smoothstep(0.55, 0.95, n2));

            // Denser starfield — extra layers and lower thresholds so more
            // cells seed a star.
            float stars = 0.0;
            stars += starLayer(vLocalPos.xy, 0.55, 0.78, 14.0) * 1.2;
            stars += starLayer(vLocalPos.xy, 1.10, 0.84, 18.0) * 1.0;
            stars += starLayer(vLocalPos.xy, 2.20, 0.88, 22.0) * 0.8;
            stars += starLayer(vLocalPos.xy, 4.20, 0.92, 26.0) * 0.55;
            stars += starLayer(vLocalPos.xy, 7.50, 0.95, 30.0) * 0.4;
            stars += starLayer(vLocalPos.xy, 12.0, 0.97, 34.0) * 0.28;

            vec3 color = deepSpace;
            color += nebula * nebulaDensity * 0.55;
            color += vec3(1.0, 0.92, 0.78) * stars * 2.4;

            // Vibrant orange back glow — radial gradient brightest at center, fades to rim
            float dCenter = length(vLocalPos.xy - uCenter) / max(uRadius, 0.0001);
            float coreGlow = exp(-dCenter * 1.6);
            float rimHaze  = exp(-dCenter * 3.2) * 0.6;
            vec3 emberColor = vec3(1.0, 0.45, 0.10);
            vec3 hotCore    = vec3(1.0, 0.78, 0.40);
            color += emberColor * coreGlow * 1.8;
            color += hotCore * rimHaze * 1.2;

            // Inner rim ring of brighter heat right at the silhouette edge
            float edgeRing = smoothstep(0.85, 1.0, dCenter) * (1.0 - smoothstep(1.0, 1.05, dCenter));
            color += vec3(1.0, 0.55, 0.18) * edgeRing * 1.5;

            // Darken side faces so the logo's 3D depth still reads
            float facing = abs(vNormal.z);
            color *= mix(0.35, 1.0, facing);

            gl_FragColor = vec4(color, 1.0);
          }
        `,
      });
    }

    // Load model
    const loader = new GLTFLoader();
    loader.load('./3DModels/SDG_logo_3d.glb', (gltf) => {
      const model = gltf.scene;

      // Center the model
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(center);

      // Apply amber yellow material to all meshes
      model.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshStandardMaterial({
            color: 0xFFBF00,
            metalness: 0.6,
            roughness: 0.35,
            flatShading: true,
          });
          child.geometry.computeVertexNormals();
          // Vertical gradient: deeper/warmer at the base, neutral at the top.
          applyGradientTint(child.material, {
            minY: -5.5,
            maxY: 3.5,
            darkTint:   [0.72, 0.58, 0.40],
            brightTint: [1.05, 1.02, 0.95],
          });
        }
      });

      // Galaxy / stars BACKGROUND: a SOLID silhouette of the logo's front face
      // (convex hull of the front-face vertices) so there are no holes through the
      // center. Placed as a flat plate just behind the amber logo so the galaxy
      // fills the entire amber silhouette — including any cutouts in the source
      // geometry — and peeks out slightly around the rim as a halo.
      galaxyMat = createGalaxyMaterial();
      let __logoMesh;
      model.traverse(c => { if (c.isMesh && !__logoMesh) __logoMesh = c; });
      if (__logoMesh) {
        const posAttr = __logoMesh.geometry.attributes.position;

        // Front face = vertices at the max local z
        let maxZ = -Infinity;
        for (let i = 0; i < posAttr.count; i++) maxZ = Math.max(maxZ, posAttr.getZ(i));
        const frontPts = [];
        for (let i = 0; i < posAttr.count; i++) {
          if (Math.abs(posAttr.getZ(i) - maxZ) < 0.25) {
            frontPts.push({ x: posAttr.getX(i), y: posAttr.getY(i) });
          }
        }

        // Andrew's monotone-chain 2D convex hull — solid outer outline, no holes
        const cross2 = (O, A, B) => (A.x - O.x) * (B.y - O.y) - (A.y - O.y) * (B.x - O.x);
        const sorted = frontPts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
        const lower = [];
        for (const p of sorted) {
          while (lower.length >= 2 && cross2(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
          lower.push(p);
        }
        const upper = [];
        for (let i = sorted.length - 1; i >= 0; i--) {
          const p = sorted[i];
          while (upper.length >= 2 && cross2(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
          upper.push(p);
        }
        upper.pop(); lower.pop();
        const hull = lower.concat(upper);

        if (hull.length >= 3) {
          // Match the logo silhouette exactly so the galaxy fits perfectly behind the model
          let cx = 0, cy = 0;
          for (const h of hull) { cx += h.x; cy += h.y; }
          cx /= hull.length; cy /= hull.length;
          const haloScale = 1.0;

          const shape = new THREE.Shape();
          shape.moveTo(cx + (hull[0].x - cx) * haloScale, cy + (hull[0].y - cy) * haloScale);
          for (let i = 1; i < hull.length; i++) {
            shape.lineTo(cx + (hull[i].x - cx) * haloScale, cy + (hull[i].y - cy) * haloScale);
          }
          shape.closePath();

          // Max distance from centroid -> use as radius for the orange glow falloff
          let maxR = 0;
          for (const h of hull) {
            const dx = h.x - cx, dy = h.y - cy;
            const r = Math.sqrt(dx * dx + dy * dy);
            if (r > maxR) maxR = r;
          }
          galaxyMat.uniforms.uCenter.value.set(cx, cy);
          galaxyMat.uniforms.uRadius.value = maxR;

          const silhouetteGeo = new THREE.ShapeGeometry(shape);
          const galaxyMesh = new THREE.Mesh(silhouetteGeo, galaxyMat);
          galaxyMesh.position.set(0, 0, maxZ - 0.5); // just behind amber front face, in logo's local space
          galaxyMesh.renderOrder = -1;
          __logoMesh.add(galaxyMesh);

          // Inner-star centroid: average of the front-face edge midpoints that
          // fall inside the inner cutout. This is where the galaxy glow reads
          // brightest — we anchor the pattern fade here so the dissolve hugs
          // the visible hot-spot rather than the geometric hull centroid.
          __logoMesh.geometry.computeBoundingBox();
          const _bb = __logoMesh.geometry.boundingBox;
          const _halfExtent = Math.max((_bb.max.x - _bb.min.x) * 0.5, (_bb.max.y - _bb.min.y) * 0.5);
          const _zTol = Math.max(_halfExtent * 0.02, 0.1);
          const _innerR = _halfExtent * 0.58;
          const _edgesGeo = new THREE.EdgesGeometry(__logoMesh.geometry, 30);
          const _ep = _edgesGeo.attributes.position;
          let _ix = 0, _iy = 0, _ic = 0;
          for (let i = 0; i < _ep.count; i += 2) {
            const x1 = _ep.getX(i), y1 = _ep.getY(i), z1 = _ep.getZ(i);
            const x2 = _ep.getX(i + 1), y2 = _ep.getY(i + 1), z2 = _ep.getZ(i + 1);
            const mx = (x1 + x2) * 0.5, my = (y1 + y2) * 0.5;
            const d = Math.sqrt(mx * mx + my * my);
            if (d < _innerR && Math.abs(z1 - maxZ) < _zTol && Math.abs(z2 - maxZ) < _zTol) {
              _ix += mx; _iy += my; _ic++;
            }
          }
          const innerCenterX = _ic ? _ix / _ic : cx;
          const innerCenterY = _ic ? _iy / _ic : cy;
          // Panel is positioned at (cx, cy), so panel-local = mesh-local - (cx, cy).
          const patternFadeCenter = [innerCenterX - cx, innerCenterY - cy];

          // Islamic tile panel: flat grid of rosettes + straps + knots, clipped
          // to the logo's front-face hull so the motif sits only on the star.
          // Center of the panel fades to transparent so the galaxy core glow
          // bleeds through — outer rim stays opaque (less than fully, for
          // subtlety).
          const clipPolygon = hull.map(h => ({ x: h.x - cx, y: h.y - cy }));
          const tileStep = 6.5;
          const panelSpan = maxR * 1.9;
          const cols = Math.max(3, Math.ceil(panelSpan / tileStep) | 1);
          const mainTileSize = 2.4;
          const panel = createIslamicPanel({
            cols,
            rows: cols,
            tileStep,
            mainTileSize,
            secondaryScale: 0.55,
            reliefDepth: 0.35,
            strapHalfWidth: 0.3,
            knotSize: 0.7,
            goldColor: 0xB08552,
            clipPolygon,
            clipMargin: mainTileSize * 0.9,
            fadeInnerR: maxR * 0.12,
            fadeOuterR: maxR * 0.55,
            fadeCenter: patternFadeCenter,
            fadeDownStretch: 1.9,
            fadeBottomTaper: 0.9,
            maxOpacity: 0.92,
            gradientMinY: -maxR * 1.1,
            gradientMaxY:  maxR * 1.1,
            gradientDark:   [0.68, 0.55, 0.40],
            gradientBright: [1.02, 1.0, 0.95],
          });
          panel.name = 'islamic-panel';
          panel.position.set(cx, cy, maxZ + 0.05);
          __logoMesh.add(panel);

          // Lattice underlay — solid-fill hexagons on the same grid as the
          // Islamic panel so each hex frames one rosette. Clip margin =
          // hexRadius so hex corners can reach the hull edge; the outer
          // portion slips under the gate frame (which sits in front), so
          // the visible hex surface meets the frame's inner edge cleanly.
          // Also fades to transparent toward center so the inner glow is
          // not stifled by the rear layer.
          const gateFrameWidth = 1.6;
          const hexRadius = mainTileSize * 1.4;
          const underlay = createLatticeUnderlay({
            cols: cols + 2,
            rows: cols + 2,
            tileStep,
            hexRadius,
            depth: 0.035,
            color: 0x6B4A22,
            clipPolygon,
            clipMargin: hexRadius,
            fadeInnerR: maxR * 0.16,
            fadeOuterR: maxR * 0.65,
            fadeCenter: patternFadeCenter,
            fadeDownStretch: 1.9,
            fadeBottomTaper: 0.9,
            maxOpacity: 0.82,
            gradientMinY: -maxR * 1.1,
            gradientMaxY:  maxR * 1.1,
            gradientDark:   [0.60, 0.48, 0.35],
            gradientBright: [1.0, 1.0, 0.95],
          });
          underlay.name = 'lattice-underlay';
          underlay.position.set(cx, cy, maxZ + 0.005);
          __logoMesh.add(underlay);

          // Gate frame — extruded ring along the silhouette with inner/outer
          // lips and evenly-spaced bosses. Sits on top of everything at the
          // rim so the logo reads as framed by an architectural gate.
          const gate = createGateFrame({
            hull: clipPolygon,
            frameWidth: gateFrameWidth,
            frameDepth: 0.5,
            lipWidth: 0.3,
            lipDepth: 0.22,
            bossCount: 56,
            bossRadius: 0.24,
            bossDepth: 0.26,
            color: 0xB8915A,
            gradientMinY: -maxR * 1.1,
            gradientMaxY:  maxR * 1.1,
            gradientDark:   [0.7, 0.58, 0.42],
            gradientBright: [1.02, 1.0, 0.95],
          });
          gate.name = 'gate-frame';
          gate.position.set(cx, cy, maxZ + 0.45);
          __logoMesh.add(gate);

          // Stash on model so we can refresh fade matrices after scene.add()
          // has computed each group's world transform.
          model.userData.patternsToRefresh = [panel, underlay];
        }
      }

      // Scale bigger
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 8 / maxDim;
      model.scale.setScalar(scale);

      // Reset any rotation
      model.rotation.set(0, 0, 0);

      // Shift down on Y axis to visually center on screen
      model.position.y -= 1.0;

      scene.add(model);

      // Compute each pattern group's inverse world matrix so the fade shader
      // can convert world positions back into panel-local coords. Must run
      // after scene.add so world matrices reflect the final scale/position.
      scene.updateMatrixWorld(true);
      (model.userData.patternsToRefresh || []).forEach(g => {
        if (g.userData.refreshFade) g.userData.refreshFade();
      });

      // --- Star Particle Effect with Gravitational Flow ---
      // Pick the original logo mesh (highest vertex count), not any silhouette child
      let targetMesh;
      let maxVerts = 0;
      model.traverse(c => {
        if (c.isMesh && c.geometry && c.geometry.attributes.position) {
          const n = c.geometry.attributes.position.count;
          if (n > maxVerts) { maxVerts = n; targetMesh = c; }
        }
      });

      const edgesGeo = new THREE.EdgesGeometry(targetMesh.geometry, 30);
      const edgePos = edgesGeo.attributes.position;

      // Derive front-face z and inner-cutout cutoff from the mesh bbox so
      // detection survives model rescales — hardcoded thresholds (z≈12,
      // dist<25) silently dropped all segments when the geometry changed.
      targetMesh.geometry.computeBoundingBox();
      const bbox = targetMesh.geometry.boundingBox;
      const frontZ = bbox.max.z;
      const halfW = (bbox.max.x - bbox.min.x) * 0.5;
      const halfH = (bbox.max.y - bbox.min.y) * 0.5;
      const halfExtent = Math.max(halfW, halfH);
      const zTol = Math.max(halfExtent * 0.02, 0.1);
      // Inner-star filter — spans the full inner motif (histogram valley
      // sits around dist 0.58*halfExtent before the outer lamp silhouette
      // explodes), so this catches the whole outline, not just its tips.
      const innerRadius = halfExtent * 0.58;

      // Collect inner-star outline edge segments on the front face
      const starSegments = [];
      for (let i = 0; i < edgePos.count; i += 2) {
        const x1 = edgePos.getX(i), y1 = edgePos.getY(i), z1 = edgePos.getZ(i);
        const x2 = edgePos.getX(i+1), y2 = edgePos.getY(i+1), z2 = edgePos.getZ(i+1);
        const mx = (x1+x2)/2, my = (y1+y2)/2;
        const dist = Math.sqrt(mx*mx + my*my);
        if (dist < innerRadius && Math.abs(z1 - frontZ) < zTol && Math.abs(z2 - frontZ) < zTol) {
          starSegments.push({x1, y1, x2, y2});
        }
      }

      // Fallback: if no inner cutout was detected, synthesise a circular arch
      // outline at the front face so particles still have something to emerge from.
      if (starSegments.length === 0) {
        const R = innerRadius * 0.7;
        const N = 48;
        for (let i = 0; i < N; i++) {
          const a1 = (i / N) * Math.PI * 2;
          const a2 = ((i + 1) / N) * Math.PI * 2;
          starSegments.push({
            x1: Math.cos(a1) * R, y1: Math.sin(a1) * R,
            x2: Math.cos(a2) * R, y2: Math.sin(a2) * R,
          });
        }
      }

      // Floating ember particles: emerge from deep inside the model (the orange
      // back-glow), pour through the star opening, then drift out toward the
      // camera and disperse outward + upward — matching the portal reference.
      const particleCount = 20000; //was 8000
      const origins  = new Float32Array(particleCount * 3);   // deep inside the model
      const passages = new Float32Array(particleCount * 3);   // through the star opening
      const targets  = new Float32Array(particleCount * 3);   // out front + outward + upward
      const randoms  = new Float32Array(particleCount);
      const speeds   = new Float32Array(particleCount);
      const sizes    = new Float32Array(particleCount);

      let totalLength = 0;
      const lengths = starSegments.map(s => {
        const l = Math.sqrt((s.x2-s.x1)**2 + (s.y2-s.y1)**2);
        totalLength += l;
        return l;
      });

      // Sample a point inside the star cutout (pulled inward from outline)
      function sampleStarInterior() {
        let t = Math.random() * totalLength;
        let segIdx = 0;
        while (segIdx < lengths.length - 1 && t > lengths[segIdx]) {
          t -= lengths[segIdx];
          segIdx++;
        }
        const s = starSegments[segIdx];
        const frac = lengths[segIdx] > 0 ? t / lengths[segIdx] : 0;
        const ex = s.x1 + (s.x2 - s.x1) * frac;
        const ey = s.y1 + (s.y2 - s.y1) * frac;
        const inward = 0.15 + Math.random() * 0.75;
        return [ex * (1 - inward), ey * (1 - inward)];
      }

      // Sample exactly on the star outline (front edge of cutout)
      function sampleStarOutline() {
        let t = Math.random() * totalLength;
        let segIdx = 0;
        while (segIdx < lengths.length - 1 && t > lengths[segIdx]) {
          t -= lengths[segIdx];
          segIdx++;
        }
        const s = starSegments[segIdx];
        const frac = lengths[segIdx] > 0 ? t / lengths[segIdx] : 0;
        return [s.x1 + (s.x2 - s.x1) * frac, s.y1 + (s.y2 - s.y1) * frac];
      }

      const bottomY = bbox.min.y;

      // Shared distant attractor — deep into the galaxy backdrop behind the
      // logo. Particles are pulled in this direction with a cone of spread
      // so they drift toward the distance without converging on one point.
      // If a particle's path intersects the logo mesh, the depth test below
      // will occlude it, giving a "collision" read against the model.
      const attractor = {
        x: 0,
        y: halfExtent * 3.5,
        z: frontZ - halfExtent * 6.0,
      };
      const attractorSpread = halfExtent * 2.2;

      for (let i = 0; i < particleCount; i++) {
        // Origin: exactly on the inner star outline with a tiny jitter so
        // the shape reads as a crisp traced edge.
        const [ox, oy] = sampleStarOutline();
        const jitter = halfExtent * 0.004;
        origins[i * 3]     = ox + (Math.random() - 0.5) * jitter;
        origins[i * 3 + 1] = oy + (Math.random() - 0.5) * jitter;
        origins[i * 3 + 2] = frontZ;

        // Passage: still tracing the outline, nudged BEHIND the front face so
        // the Bezier arc stays behind the model the whole way to the attractor
        // (no forward bulge in front of the logo).
        const [px, py] = sampleStarOutline();
        passages[i * 3]     = px;
        passages[i * 3 + 1] = py;
        passages[i * 3 + 2] = frontZ - halfExtent * 0.1;

        // Target: soft cloud around the shared attractor — particles drift
        // toward the distant point rather than converging on it.
        targets[i * 3]     = attractor.x + (Math.random() - 0.5) * attractorSpread;
        targets[i * 3 + 1] = attractor.y + (Math.random() - 0.5) * attractorSpread;
        targets[i * 3 + 2] = attractor.z + (Math.random() - 0.5) * attractorSpread * 0.8;

        randoms[i] = Math.random();
        speeds[i] = 0.25 + Math.random() * 0.7;   // slow, floaty

        // Ember-style size distribution: lots of fine dust + occasional bright heroes
        const r = Math.random();
        if (r < 0.08) sizes[i] = 3.2 + Math.random() * 2.5;       // bright hero embers
        else if (r < 0.3) sizes[i] = 1.4 + Math.random() * 1.2;   // medium
        else sizes[i] = 0.4 + Math.random() * 0.8;                // fine dust
      }

      const particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute('position', new THREE.BufferAttribute(origins, 3));
      particleGeo.setAttribute('aPassage', new THREE.BufferAttribute(passages, 3));
      particleGeo.setAttribute('aTarget', new THREE.BufferAttribute(targets, 3));
      particleGeo.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));
      particleGeo.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
      particleGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

      particleMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: renderer.getPixelRatio() },
        },
        vertexShader: `
          uniform float uTime;
          uniform float uPixelRatio;
          attribute vec3 aPassage;
          attribute vec3 aTarget;
          attribute float aRandom;
          attribute float aSpeed;
          attribute float aSize;
          varying float vAlpha;
          varying float vProgress;
          varying float vSize;

          void main() {
            // Each particle loops independently
            float cycleDuration = 7.0 / aSpeed;
            float t = mod(uTime + aRandom * cycleDuration, cycleDuration) / cycleDuration;

            // Steep ease-in (quintic) — particles cluster tightly near the
            // origin for most of the cycle and accelerate only near the end,
            // so density reads highest at the start of their lifespan.
            float eased = t * t * t * t * t;

            // Quadratic Bezier: deep inside -> star passage -> outward & forward
            vec3 p0 = position;
            vec3 p1 = aPassage;
            vec3 p2 = aTarget;
            float mt = 1.0 - eased;
            vec3 pos = mt*mt*p0 + 2.0*mt*eased*p1 + eased*eased*p2;

            // Wobble — zero at origin so the outline reads crisply, growing
            // only as particles leave the star and drift toward the attractor.
            float wobble = eased * 1.0;
            pos.x += sin(uTime * 0.9 + aRandom * 50.0) * 0.6 * wobble;
            pos.y += cos(uTime * 0.7 + aRandom * 50.0) * 0.6 * wobble;
            pos.y += eased * eased * 1.2;  // extra gentle lift as they fly out

            vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPos;

            // Gentle flicker like real embers
            float flicker = 0.7 + 0.3 * sin(uTime * 3.0 + aRandom * 6.28);
            float sizeCurve = 0.6 + 0.4 * sin(t * 3.14159);
            gl_PointSize = max(aSize * (10.0 + sizeCurve * 9.0) * flicker * uPixelRatio * (1.0 / -mvPos.z), 1.0);

            // Quick fade-in so particles are already bright while dense at origin
            float fadeIn  = smoothstep(0.0, 0.04, t);
            float fadeOut = 1.0 - smoothstep(0.55, 1.0, t);
            vAlpha = fadeIn * fadeOut * 1.7;
            vProgress = t;
            vSize = aSize;
          }
        `,
        fragmentShader: `
          varying float vAlpha;
          varying float vProgress;
          varying float vSize;

          void main() {
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;

            // Tight bright core + soft halo — like the reference embers
            float core = 1.0 - smoothstep(0.0, 0.12, d);
            float halo = 1.0 - smoothstep(0.0, 0.5, d);
            halo = pow(halo, 1.8);

            // Uniform warm amber throughout
            vec3 emberBody = vec3(1.0, 0.52, 0.10);   // warm orange
            vec3 emberCore = vec3(1.0, 0.88, 0.55);   // hot yellow-white core

            vec3 color = mix(emberBody, emberCore, core * 0.85);

            // Big particles get a more prominent hot core
            float bigBoost = smoothstep(2.0, 4.5, vSize);
            color += emberCore * core * bigBoost * 0.7;

            gl_FragColor = vec4(color, halo * vAlpha);
          }
        `,
        transparent: true,
        depthTest: true,   // let the logo mesh depth-cull particles it blocks
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });

      const particles = new THREE.Points(particleGeo, particleMat);
      targetMesh.add(particles);

      // Pull camera back to fit the larger model
      camera.position.set(0, -1.0, 6);
      controls.target.set(0, -1.0, 0);
      controls.update();
    });

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animate
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      const t = clock.getElapsedTime();
      if (particleMat) particleMat.uniforms.uTime.value = t;
      if (galaxyMat) galaxyMat.uniforms.uTime.value = t;
      // Directional-light breathing: key sweeps hard, rim drifts on offset phase
      // so you can actually see shading shift across the logo. ~6s cycle.
      keyLight.intensity = 2.5 + 2.0 * Math.sin(t * 1.0);
      rimLight.intensity = 1.5 + 1.0 * Math.sin(t * 1.0 + Math.PI * 0.5);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
