<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000000; font-family: Arial, sans-serif; }
    canvas { display: block; }

    #panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 280px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(20, 20, 40, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 16px;
      color: #ddd;
      font-size: 13px;
      z-index: 100;
    }
    #panel h2 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 8px;
      cursor: pointer;
    }
    .light-section {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .light-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .light-header span { font-weight: bold; font-size: 13px; }
    .light-header button {
      background: rgba(255, 60, 60, 0.7);
      border: none;
      color: #fff;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 11px;
    }
    .light-header button:hover { background: rgba(255, 60, 60, 1); }
    .control-row {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
    }
    .control-row label {
      width: 70px;
      font-size: 12px;
      color: #aaa;
      flex-shrink: 0;
    }
    .control-row input[type="range"] {
      flex: 1;
      height: 4px;
      accent-color: #FFBF00;
    }
    .control-row input[type="color"] {
      width: 32px;
      height: 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }
    .control-row .value {
      width: 36px;
      text-align: right;
      font-size: 11px;
      color: #888;
    }
    #addLightBtn {
      width: 100%;
      padding: 8px;
      background: rgba(255, 191, 0, 0.2);
      border: 1px solid rgba(255, 191, 0, 0.4);
      color: #FFBF00;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 4px;
    }
    #addLightBtn:hover { background: rgba(255, 191, 0, 0.35); }
    #togglePanel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 101;
      background: rgba(20, 20, 40, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: #FFBF00;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Scene
    const scene = new THREE.Scene();
    window.__scene = scene;
    window.__THREE = THREE;
    scene.background = new THREE.Color(0x000000);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 3);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // Environment map for metallic reflections
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x888888);
    const envMap = pmremGenerator.fromScene(envScene).texture;
    scene.environment = envMap;

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(4, 5, 3);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 0.8);
    rimLight.position.set(-4, 3, -4);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
    fillLight.position.set(0, -4, 2);
    scene.add(fillLight);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    // Particle material (created once, updated in animate loop)
    let particleMat = null;

    // Load model
    const loader = new GLTFLoader();
    loader.load('./3DModels/fixed.glb', (gltf) => {
      const model = gltf.scene;

      // Center the model
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(center);

      // Apply amber yellow material to all meshes
      model.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshStandardMaterial({
            color: 0xFFBF00,
            metalness: 0.9,
            roughness: 0.15,
            flatShading: true,
          });
          child.geometry.computeVertexNormals();
        }
      });

      // Scale bigger
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 8 / maxDim;
      model.scale.setScalar(scale);

      // Reset any rotation
      model.rotation.set(0, 0, 0);

      // Shift down on Y axis to visually center on screen
      model.position.y -= 1.0;

      scene.add(model);

      // --- Star Particle Effect with Gravitational Flow ---
      let targetMesh;
      model.traverse(c => { if (c.isMesh) targetMesh = c; });

      const edgesGeo = new THREE.EdgesGeometry(targetMesh.geometry, 30);
      const edgePos = edgesGeo.attributes.position;

      // Collect star outline edge segments on front face (z ~ 12)
      const starSegments = [];
      for (let i = 0; i < edgePos.count; i += 2) {
        const x1 = edgePos.getX(i), y1 = edgePos.getY(i), z1 = edgePos.getZ(i);
        const x2 = edgePos.getX(i+1), y2 = edgePos.getY(i+1), z2 = edgePos.getZ(i+1);
        const mx = (x1+x2)/2, my = (y1+y2)/2;
        const dist = Math.sqrt(mx*mx + my*my);
        if (dist < 25 && Math.abs(z1 - 12) < 0.1 && Math.abs(z2 - 12) < 0.1) {
          starSegments.push({x1, y1, x2, y2});
        }
      }

      // Sample particle origin positions along the star outline
      const particleCount = 8000;
      const origins = new Float32Array(particleCount * 3);
      const randoms = new Float32Array(particleCount);
      const speeds = new Float32Array(particleCount);
      const sizes = new Float32Array(particleCount);
      const swirlAmounts = new Float32Array(particleCount);

      let totalLength = 0;
      const lengths = starSegments.map(s => {
        const l = Math.sqrt((s.x2-s.x1)**2 + (s.y2-s.y1)**2);
        totalLength += l;
        return l;
      });

      for (let i = 0; i < particleCount; i++) {
        let t = Math.random() * totalLength;
        let segIdx = 0;
        while (segIdx < lengths.length - 1 && t > lengths[segIdx]) {
          t -= lengths[segIdx];
          segIdx++;
        }
        const s = starSegments[segIdx];
        const frac = lengths[segIdx] > 0 ? t / lengths[segIdx] : 0;

        origins[i * 3]     = s.x1 + (s.x2 - s.x1) * frac;
        origins[i * 3 + 1] = s.y1 + (s.y2 - s.y1) * frac;
        origins[i * 3 + 2] = 13.0;

        randoms[i] = Math.random();
        speeds[i] = 0.3 + Math.random() * 1.2;

        // Random size class: most small, some medium, a few big
        const r = Math.random();
        if (r < 0.15) sizes[i] = 2.5 + Math.random() * 2.5;      // big sparklers
        else if (r < 0.4) sizes[i] = 1.2 + Math.random() * 1.0;   // medium
        else sizes[i] = 0.4 + Math.random() * 0.8;                 // small dust

        // Swirl intensity: some particles go straight, some twirl wildly
        const sw = Math.random();
        if (sw < 0.25) swirlAmounts[i] = 3.0 + Math.random() * 5.0;  // heavy twirlers
        else if (sw < 0.5) swirlAmounts[i] = 1.0 + Math.random() * 2.0; // moderate
        else swirlAmounts[i] = Math.random() * 0.5;                    // mostly straight
      }

      const particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute('position', new THREE.BufferAttribute(origins, 3));
      particleGeo.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));
      particleGeo.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
      particleGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      particleGeo.setAttribute('aSwirl', new THREE.BufferAttribute(swirlAmounts, 1));

      // Gravitational attractor: far behind and above the model
      particleMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: renderer.getPixelRatio() },
          uAttractor: { value: new THREE.Vector3(0, 50, -120) },
        },
        vertexShader: `
          uniform float uTime;
          uniform float uPixelRatio;
          uniform vec3 uAttractor;
          attribute float aRandom;
          attribute float aSpeed;
          attribute float aSize;
          attribute float aSwirl;
          varying float vAlpha;
          varying float vProgress;
          varying float vSize;

          void main() {
            // Each particle loops on its own cycle
            float cycleDuration = 5.0 / aSpeed;
            float t = mod(uTime + aRandom * cycleDuration, cycleDuration) / cycleDuration;

            // Smooth ease with randomized curve shape
            float eased = t * t * (3.0 - 2.0 * t);

            // Interpolate from star origin toward distant attractor
            vec3 pos = mix(position, uAttractor, eased);

            // Swirl/twirl motion — intensity varies per particle
            float swirlSpeed = 1.0 + aRandom * 3.0;
            float spiral = t * 6.28318 * swirlSpeed;
            float swirlEnvelope = sin(t * 3.14159); // peaks mid-journey
            float spiralRadius = aSwirl * swirlEnvelope;

            // Offset phase per particle so twirls don't sync
            float phase = aRandom * 6.28318;
            pos.x += cos(spiral + phase) * spiralRadius;
            pos.y += sin(spiral + phase) * spiralRadius;
            pos.z += sin(spiral * 0.7 + phase) * spiralRadius * 0.3;

            // Extra random wobble for organic feel
            pos.x += sin(uTime * 2.3 + aRandom * 50.0) * 0.4 * swirlEnvelope;
            pos.y += cos(uTime * 1.9 + aRandom * 50.0) * 0.4 * swirlEnvelope;

            vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPos;

            // Size: per-particle base size + pulse + journey curve
            float pulse = 0.8 + 0.2 * sin(uTime * 4.0 + aRandom * 6.28);
            float sizeCurve = 0.5 + 0.5 * sin(t * 3.14159);
            gl_PointSize = max(aSize * (10.0 + sizeCurve * 14.0) * pulse * uPixelRatio * (1.0 / -mvPos.z), 1.0);

            // Fade in quickly, bright middle, fade out near end
            vAlpha = smoothstep(0.0, 0.05, t) * smoothstep(1.0, 0.6, t);
            vProgress = t;
            vSize = aSize;
          }
        `,
        fragmentShader: `
          varying float vAlpha;
          varying float vProgress;
          varying float vSize;

          void main() {
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;

            // Softer glow for big particles, sharper for small
            float sharpness = mix(1.8, 1.0, clamp(vSize / 3.0, 0.0, 1.0));
            float glow = 1.0 - smoothstep(0.0, 0.5, d);
            glow = pow(glow, sharpness);

            // Warm gold near star -> cool white as it drifts
            vec3 warmColor = vec3(1.0, 0.75, 0.3);
            vec3 coolColor = vec3(0.7, 0.85, 1.0);
            vec3 color = mix(warmColor, coolColor, vProgress);

            // Big particles get a brighter hot core
            float coreBrightness = smoothstep(1.5, 4.0, vSize) * 0.6;
            color = mix(color, vec3(1.0), glow * (0.5 + coreBrightness));

            gl_FragColor = vec4(color, glow * vAlpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });

      const particles = new THREE.Points(particleGeo, particleMat);
      targetMesh.add(particles);

      // Pull camera back to fit the larger model
      camera.position.set(0, -1.0, 6);
      controls.target.set(0, -1.0, 0);
      controls.update();
    });

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animate
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      if (particleMat) {
        particleMat.uniforms.uTime.value = clock.getElapsedTime();
      }
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
