<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000000; font-family: Arial, sans-serif; }
    canvas { display: block; }

    #panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 280px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(20, 20, 40, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 16px;
      color: #ddd;
      font-size: 13px;
      z-index: 100;
    }
    #panel h2 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 8px;
      cursor: pointer;
    }
    .light-section {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .light-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .light-header span { font-weight: bold; font-size: 13px; }
    .light-header button {
      background: rgba(255, 60, 60, 0.7);
      border: none;
      color: #fff;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 11px;
    }
    .light-header button:hover { background: rgba(255, 60, 60, 1); }
    .control-row {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
    }
    .control-row label {
      width: 70px;
      font-size: 12px;
      color: #aaa;
      flex-shrink: 0;
    }
    .control-row input[type="range"] {
      flex: 1;
      height: 4px;
      accent-color: #FFBF00;
    }
    .control-row input[type="color"] {
      width: 32px;
      height: 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }
    .control-row .value {
      width: 36px;
      text-align: right;
      font-size: 11px;
      color: #888;
    }
    #addLightBtn {
      width: 100%;
      padding: 8px;
      background: rgba(255, 191, 0, 0.2);
      border: 1px solid rgba(255, 191, 0, 0.4);
      color: #FFBF00;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 4px;
    }
    #addLightBtn:hover { background: rgba(255, 191, 0, 0.35); }
    #togglePanel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 101;
      background: rgba(20, 20, 40, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: #FFBF00;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createIslamicDome } from './patterns/islamic-tile.js';

    // Scene
    const scene = new THREE.Scene();
    window.__scene = scene;
    window.__THREE = THREE;
    scene.background = new THREE.Color(0x000000);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 3);
    window.__camera = camera;

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    document.body.appendChild(renderer.domElement);

    // Environment map for metallic reflections
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x888888);
    const envMap = pmremGenerator.fromScene(envScene).texture;
    scene.environment = envMap;

    // Lights — cinematic rim lighting for stronger dimension
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(5, 8, 4);  // steeper top-front-right
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x4d8aff, 1.5);  // cool blue, from behind
    rimLight.position.set(-3, 2, -6);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
    fillLight.position.set(0, -4, 2);
    scene.add(fillLight);

    // Vibrant orange back glow — spills onto dome from inside the model
    const innerGlow = new THREE.PointLight(0xff6a18, 80, 40, 1.6);
    innerGlow.position.set(0, -1.0, -2.0);
    scene.add(innerGlow);

    // Islamic tile dome wrapping the scene
    const dome = createIslamicDome();
    dome.name = 'islamic-dome';
    scene.add(dome);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);
    window.__controls = controls;

    // Particle material (created once, updated in animate loop)
    let particleMat = null;
    let galaxyMat = null;

    // Galaxy / deep-space shader — stars + nebula, masked automatically by the logo mesh shape
    function createGalaxyMaterial() {
      return new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uCenter: { value: new THREE.Vector2(0, 0) },
          uRadius: { value: 1.0 },
        },
        vertexShader: `
          varying vec3 vLocalPos;
          varying vec3 vNormal;
          void main() {
            vLocalPos = position;
            vNormal = normal;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec2 uCenter;
          uniform float uRadius;
          varying vec3 vLocalPos;
          varying vec3 vNormal;

          float hash21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

          float vnoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
                       mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x), u.y);
          }

          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 6; i++) {
              v += a * vnoise(p);
              p = p * 2.03 + vec2(17.0, 31.0);
              a *= 0.5;
            }
            return v;
          }

          float starLayer(vec2 p, float scale, float threshold, float sharpness) {
            p *= scale;
            vec2 cell = floor(p);
            vec2 f = fract(p) - 0.5;
            float n = hash21(cell);
            if (n < threshold) return 0.0;
            vec2 jitter = vec2(hash21(cell + 13.17), hash21(cell + 47.31)) - 0.5;
            float d = length(f - jitter * 0.6);
            float intensity = (n - threshold) / (1.0 - threshold);
            float twinkle = 0.55 + 0.45 * sin(uTime * (1.5 + n * 7.0) + n * 100.0);
            return smoothstep(0.5, 0.0, d * sharpness) * intensity * twinkle;
          }

          void main() {
            vec2 p = vLocalPos.xy * 0.08;

            vec2 flow = vec2(uTime * 0.010, uTime * 0.008);
            float n1 = fbm(p * 0.6 + flow);
            float n2 = fbm(p * 1.4 - flow * 0.5 + vec2(5.0, -3.0));
            float nebulaDensity = pow(clamp(n1 * n2 * 2.6, 0.0, 1.5), 1.6);

            vec3 deepSpace = vec3(0.010, 0.006, 0.035);
            vec3 nebPurple = vec3(0.45, 0.15, 0.80);
            vec3 nebBlue   = vec3(0.08, 0.30, 0.95);
            vec3 nebPink   = vec3(0.95, 0.25, 0.55);
            vec3 nebula = mix(nebPurple, nebBlue, n1);
            nebula = mix(nebula, nebPink, smoothstep(0.45, 0.9, n2));

            float stars = 0.0;
            stars += starLayer(vLocalPos.xy, 0.55, 0.88, 14.0) * 1.2;
            stars += starLayer(vLocalPos.xy, 1.10, 0.92, 18.0) * 0.9;
            stars += starLayer(vLocalPos.xy, 2.60, 0.95, 22.0) * 0.6;
            stars += starLayer(vLocalPos.xy, 5.20, 0.97, 28.0) * 0.35;

            vec3 color = deepSpace;
            color += nebula * nebulaDensity * 0.6;   // dim the cool nebula so warmth dominates
            color += vec3(1.0, 0.96, 0.92) * stars * 2.4;

            // Vibrant orange back glow — radial gradient brightest at center, fades to rim
            float dCenter = length(vLocalPos.xy - uCenter) / max(uRadius, 0.0001);
            float coreGlow = exp(-dCenter * 1.6);
            float rimHaze  = exp(-dCenter * 3.2) * 0.6;
            vec3 emberColor = vec3(1.0, 0.45, 0.10);
            vec3 hotCore    = vec3(1.0, 0.78, 0.40);
            color += emberColor * coreGlow * 1.8;
            color += hotCore * rimHaze * 1.2;

            // Inner rim ring of brighter heat right at the silhouette edge
            float edgeRing = smoothstep(0.85, 1.0, dCenter) * (1.0 - smoothstep(1.0, 1.05, dCenter));
            color += vec3(1.0, 0.55, 0.18) * edgeRing * 1.5;

            // Darken side faces so the logo's 3D depth still reads
            float facing = abs(vNormal.z);
            color *= mix(0.35, 1.0, facing);

            gl_FragColor = vec4(color, 1.0);
          }
        `,
      });
    }

    // Load model
    const loader = new GLTFLoader();
    loader.load('./3DModels/fixed.glb', (gltf) => {
      const model = gltf.scene;

      // Center the model
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(center);

      // Apply amber yellow material to all meshes
      model.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshStandardMaterial({
            color: 0xFFBF00,
            metalness: 0.6,
            roughness: 0.35,
            flatShading: true,
          });
          child.geometry.computeVertexNormals();
        }
      });

      // Galaxy / stars BACKGROUND: a SOLID silhouette of the logo's front face
      // (convex hull of the front-face vertices) so there are no holes through the
      // center. Placed as a flat plate just behind the amber logo so the galaxy
      // fills the entire amber silhouette — including any cutouts in the source
      // geometry — and peeks out slightly around the rim as a halo.
      galaxyMat = createGalaxyMaterial();
      let __logoMesh;
      model.traverse(c => { if (c.isMesh && !__logoMesh) __logoMesh = c; });
      if (__logoMesh) {
        const posAttr = __logoMesh.geometry.attributes.position;

        // Front face = vertices at the max local z
        let maxZ = -Infinity;
        for (let i = 0; i < posAttr.count; i++) maxZ = Math.max(maxZ, posAttr.getZ(i));
        const frontPts = [];
        for (let i = 0; i < posAttr.count; i++) {
          if (Math.abs(posAttr.getZ(i) - maxZ) < 0.25) {
            frontPts.push({ x: posAttr.getX(i), y: posAttr.getY(i) });
          }
        }

        // Andrew's monotone-chain 2D convex hull — solid outer outline, no holes
        const cross2 = (O, A, B) => (A.x - O.x) * (B.y - O.y) - (A.y - O.y) * (B.x - O.x);
        const sorted = frontPts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
        const lower = [];
        for (const p of sorted) {
          while (lower.length >= 2 && cross2(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
          lower.push(p);
        }
        const upper = [];
        for (let i = sorted.length - 1; i >= 0; i--) {
          const p = sorted[i];
          while (upper.length >= 2 && cross2(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
          upper.push(p);
        }
        upper.pop(); lower.pop();
        const hull = lower.concat(upper);

        if (hull.length >= 3) {
          // Match the logo silhouette exactly so the galaxy fits perfectly behind the model
          let cx = 0, cy = 0;
          for (const h of hull) { cx += h.x; cy += h.y; }
          cx /= hull.length; cy /= hull.length;
          const haloScale = 1.0;

          const shape = new THREE.Shape();
          shape.moveTo(cx + (hull[0].x - cx) * haloScale, cy + (hull[0].y - cy) * haloScale);
          for (let i = 1; i < hull.length; i++) {
            shape.lineTo(cx + (hull[i].x - cx) * haloScale, cy + (hull[i].y - cy) * haloScale);
          }
          shape.closePath();

          const silhouetteGeo = new THREE.ShapeGeometry(shape);
          const galaxyMesh = new THREE.Mesh(silhouetteGeo, galaxyMat);
          galaxyMesh.position.set(0, 0, maxZ - 0.5); // just behind amber front face, in logo's local space
          galaxyMesh.renderOrder = -1;
          __logoMesh.add(galaxyMesh);
        }
      }

      // Scale bigger
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 8 / maxDim;
      model.scale.setScalar(scale);

      // Reset any rotation
      model.rotation.set(0, 0, 0);

      // Shift down on Y axis to visually center on screen
      model.position.y -= 1.0;

      scene.add(model);

      // --- Star Particle Effect with Gravitational Flow ---
      // Pick the original logo mesh (highest vertex count), not any silhouette child
      let targetMesh;
      let maxVerts = 0;
      model.traverse(c => {
        if (c.isMesh && c.geometry && c.geometry.attributes.position) {
          const n = c.geometry.attributes.position.count;
          if (n > maxVerts) { maxVerts = n; targetMesh = c; }
        }
      });

      const edgesGeo = new THREE.EdgesGeometry(targetMesh.geometry, 30);
      const edgePos = edgesGeo.attributes.position;

      // Collect star outline edge segments on front face (z ~ 12)
      const starSegments = [];
      for (let i = 0; i < edgePos.count; i += 2) {
        const x1 = edgePos.getX(i), y1 = edgePos.getY(i), z1 = edgePos.getZ(i);
        const x2 = edgePos.getX(i+1), y2 = edgePos.getY(i+1), z2 = edgePos.getZ(i+1);
        const mx = (x1+x2)/2, my = (y1+y2)/2;
        const dist = Math.sqrt(mx*mx + my*my);
        if (dist < 25 && Math.abs(z1 - 12) < 0.1 && Math.abs(z2 - 12) < 0.1) {
          starSegments.push({x1, y1, x2, y2});
        }
      }

      // Floating ember particles: start in front of logo, curve through the star
      // opening toward a central vanishing point, collide with the logo surface.
      const particleCount = 10000;
      const origins = new Float32Array(particleCount * 3);       // front entry points
      const passages = new Float32Array(particleCount * 3);      // passage points inside star opening
      const randoms = new Float32Array(particleCount);
      const speeds = new Float32Array(particleCount);
      const sizes = new Float32Array(particleCount);

      let totalLength = 0;
      const lengths = starSegments.map(s => {
        const l = Math.sqrt((s.x2-s.x1)**2 + (s.y2-s.y1)**2);
        totalLength += l;
        return l;
      });

      // Sample a point inside the star cutout (pulled inward from outline)
      function sampleStarInterior() {
        let t = Math.random() * totalLength;
        let segIdx = 0;
        while (segIdx < lengths.length - 1 && t > lengths[segIdx]) {
          t -= lengths[segIdx];
          segIdx++;
        }
        const s = starSegments[segIdx];
        const frac = lengths[segIdx] > 0 ? t / lengths[segIdx] : 0;
        const ex = s.x1 + (s.x2 - s.x1) * frac;
        const ey = s.y1 + (s.y2 - s.y1) * frac;
        const inward = 0.15 + Math.random() * 0.75;
        return [ex * (1 - inward), ey * (1 - inward)];
      }

      // Sample exactly on the star outline (front edge of cutout)
      function sampleStarOutline() {
        let t = Math.random() * totalLength;
        let segIdx = 0;
        while (segIdx < lengths.length - 1 && t > lengths[segIdx]) {
          t -= lengths[segIdx];
          segIdx++;
        }
        const s = starSegments[segIdx];
        const frac = lengths[segIdx] > 0 ? t / lengths[segIdx] : 0;
        return [s.x1 + (s.x2 - s.x1) * frac, s.y1 + (s.y2 - s.y1) * frac];
      }

      for (let i = 0; i < particleCount; i++) {
        // Origin: EXACTLY on the star outline (front edge of the negative space)
        const [ox, oy] = sampleStarOutline();
        origins[i * 3]     = ox;
        origins[i * 3 + 1] = oy;
        origins[i * 3 + 2] = 13.0;  // right at the front face plane

        // Passage: slightly inset from outline and pulled back a bit, so flow curves inward
        // before continuing to the distant center
        const insetFactor = 0.35 + Math.random() * 0.25;
        passages[i * 3]     = ox * insetFactor;
        passages[i * 3 + 1] = oy * insetFactor;
        passages[i * 3 + 2] = -5 - Math.random() * 10;

        randoms[i] = Math.random();
        speeds[i] = 0.25 + Math.random() * 0.7;   // slower, more floaty

        // Ember-style size distribution: mostly fine dust + occasional bright heroes
        const r = Math.random();
        if (r < 0.08) sizes[i] = 3.2 + Math.random() * 2.5;       // bright hero embers
        else if (r < 0.3) sizes[i] = 1.4 + Math.random() * 1.2;   // medium
        else sizes[i] = 0.4 + Math.random() * 0.8;                // fine dust
      }

      const particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute('position', new THREE.BufferAttribute(origins, 3));
      particleGeo.setAttribute('aPassage', new THREE.BufferAttribute(passages, 3));
      particleGeo.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));
      particleGeo.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
      particleGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

      particleMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: renderer.getPixelRatio() },
          uAttractor: { value: new THREE.Vector3(0, 0, -600) },
        },
        vertexShader: `
          uniform float uTime;
          uniform float uPixelRatio;
          uniform vec3 uAttractor;
          attribute vec3 aPassage;
          attribute float aRandom;
          attribute float aSpeed;
          attribute float aSize;
          varying float vAlpha;
          varying float vProgress;
          varying float vSize;

          // 4-pointed star radius approximation (cardinal points, concave between)
          float starRadius(float theta) {
            float c = abs(cos(2.0 * theta));
            return 4.0 + 22.0 * pow(c, 3.0);
          }

          void main() {
            // Each particle loops independently
            float cycleDuration = 7.0 / aSpeed;
            float t = mod(uTime + aRandom * cycleDuration, cycleDuration) / cycleDuration;

            // Smooth ease (slow start, gentle pull through opening, continue to center)
            float eased = t * t * (3.0 - 2.0 * t);

            // Quadratic Bezier: front origin -> star passage -> central vanishing point
            vec3 p0 = position;
            vec3 p1 = aPassage;
            vec3 p2 = uAttractor;
            float mt = 1.0 - eased;
            vec3 pos = mt*mt*p0 + 2.0*mt*eased*p1 + eased*eased*p2;

            // Subtle wobble so the flow feels organic but not floaty
            float wobble = (1.0 - eased) * 0.5;  // only early in journey
            pos.x += sin(uTime * 0.9 + aRandom * 50.0) * 0.6 * wobble;
            pos.y += cos(uTime * 0.7 + aRandom * 50.0) * 0.6 * wobble;

            vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPos;

            // Gentle flicker like real embers
            float flicker = 0.7 + 0.3 * sin(uTime * 3.0 + aRandom * 6.28);
            float sizeCurve = 0.6 + 0.4 * sin(t * 3.14159);
            gl_PointSize = max(aSize * (10.0 + sizeCurve * 9.0) * flicker * uPixelRatio * (1.0 / -mvPos.z), 1.0);

            // Born bright at the outline, dim gradually as particle recedes
            float fadeIn = smoothstep(0.0, 0.03, t);
            float fadeOut = 1.0 - smoothstep(0.15, 1.0, t);   // stays bright early, linear fade
            vAlpha = fadeIn * fadeOut * 1.6;
            vProgress = t;
            vSize = aSize;
          }
        `,
        fragmentShader: `
          varying float vAlpha;
          varying float vProgress;
          varying float vSize;

          void main() {
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;

            // Tight bright core + soft halo — like the reference embers
            float core = 1.0 - smoothstep(0.0, 0.12, d);
            float halo = 1.0 - smoothstep(0.0, 0.5, d);
            halo = pow(halo, 1.8);

            // Uniform warm amber throughout
            vec3 emberBody = vec3(1.0, 0.52, 0.10);   // warm orange
            vec3 emberCore = vec3(1.0, 0.88, 0.55);   // hot yellow-white core

            vec3 color = mix(emberBody, emberCore, core * 0.85);

            // Big particles get a more prominent hot core
            float bigBoost = smoothstep(2.0, 4.5, vSize);
            color += emberCore * core * bigBoost * 0.7;

            gl_FragColor = vec4(color, halo * vAlpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });

      const particles = new THREE.Points(particleGeo, particleMat);
      targetMesh.add(particles);

      // Pull camera back to fit the larger model
      camera.position.set(0, -1.0, 6);
      controls.target.set(0, -1.0, 0);
      controls.update();
    });

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animate
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      const t = clock.getElapsedTime();
      if (particleMat) particleMat.uniforms.uTime.value = t;
      if (galaxyMat) galaxyMat.uniforms.uTime.value = t;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
