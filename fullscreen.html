<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Projection — Full Screen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='20' width='84' height='60' rx='6' fill='%23FFBF00'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000000; font-family: Arial, sans-serif; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- FULL-SCREEN VERSION: same engine, same nine modes, same show, but
       drawn on a procedural slab in the projector's aspect ratio instead
       of the 3D logo model. Boots straight into projection framing at the
       window's own resolution, so press F11 on the projector output and
       the picture fills it edge to edge. THE SHOW auto-starts.
       URL knobs (all optional):
         ?hole=none            solid slab, no star aperture
         ?holeScale=1.3        bigger / smaller aperture
         ?aspect=1.333         force an aspect instead of the window's
         ?w=1920&h=1080        fixed internal render size
         ?proj=0               editing view with the orbit camera
         ?ws=127.0.0.1:9980    TouchDesigner WebSocket control -->
  <script>window.__SURFACE = 'screen';</script>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "mp4-muxer": "./vendor/mp4-muxer/mp4-muxer.mjs"
      }
    }
  </script>
  <script type="module" src="./src/main.js?v=21"></script>
</body>
</html>
