<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Projection — Layers</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23FFBF00'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    /* The three shows run in these frames. The stage canvas covers them. */
    #slots iframe { position: fixed; left: 0; top: 0; border: 0; z-index: 0; pointer-events: none; }
    #stage { position: fixed; z-index: 1; display: block; background: #000; }
    #hud { position: fixed; z-index: 2; left: 10px; bottom: 8px; font: 13px/1.3 Consolas, monospace; color: #ffd89a;
           background: #000a; padding: 3px 8px; border-radius: 4px; display: none; white-space: pre; }
  </style>
</head>
<body>
  <!--
    LAYERS: a different visual on each wood layer.
    This page runs the show three times (one "story" and two "accents")
    and puts them together, layer by layer. See src/layers/director.js.

      layers.html?shape=fire04&proj=1&w=1280&h=720

    The shape needs a file  shapes/<...>/<name>.layers.json  (made by
    shapes/fire-flower/make_fg.py). Without it, the page shows the plain show.
    Keys:  L = layers on / off    O = wood lines on / off    J = mix now / stop
  -->
  <div id="slots"></div>
  <canvas id="stage"></canvas>
  <div id="hud"></div>
  <script type="module" src="./src/layers/director.js?v=2"></script>
</body>
</html>
